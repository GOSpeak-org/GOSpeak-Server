# GOSpeak Version Bump —— push 触发的发版守门员 + 发布编排。
#
# 版本号在 .github/versions/server.yaml 中显式声明。
# 每次 push 到 release 都会触发本 workflow，并判断
# 「声明的版本号是否已经发布过」：
#
#   gospeak-server-v<version> 已存在
#     → 版本号没变 → 本 workflow 成功结束并标记 skipped，不创建 tag；
#   tag 不存在（新版本号 / 版本回退到未发布过的值）
#     → 打 tag → workflow_call 调用 release.yml 与 docker.yml 执行发布。
#
# 为什么要显式调用：GitHub 会抑制由 GITHUB_TOKEN 推送所派生的 workflow
# （防递归）。只推 tag 的话，release.yml / docker.yml 的 on.push.tags 不会触发，
# 发布得靠人工 dispatch 补跑。workflow_call 是 job 级调用，不受该限制，
# 也不需要额外的 PAT。
#
# tag 名字一律由 scripts/release-naming.mjs 派生，本文件不手拼字符串。
# 也可 workflow_dispatch 手动触发一次对账（只补缺失的 tag，不覆盖已有）。

name: Version Bump

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-tags:
    name: Release declared version (skip unchanged)
    runs-on: ubuntu-latest
    outputs:
      server_tag: ${{ steps.gate.outputs.server_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        # git tag -a 会创建 annotated tag，必须有 committer 身份；
        # runner 默认没有配置，缺失时会以 "empty ident name" 直接失败。
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read declared version
        id: versions
        run: |
          set -euo pipefail
          read_version() {
            node -e '
              const { readFileSync } = require("node:fs");
              const src = readFileSync(process.argv[1], "utf8");
              const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
              if (!m) { console.error("missing version in " + process.argv[1]); process.exit(1); }
              console.log(m[1]);
            ' "$1"
          }
          echo "server=$(read_version .github/versions/server.yaml)" >> "$GITHUB_OUTPUT"

      - name: Detect published tag
        id: tags
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
        run: |
          set -euo pipefail
          git ls-remote --tags origin > "$RUNNER_TEMP/remote-tags.txt"

          tag="$(node scripts/release-naming.mjs tag server "$SERVER_VERSION")"
          if grep -qE "refs/tags/${tag}(\^\{\})?$" "$RUNNER_TEMP/remote-tags.txt"; then
            echo "server_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::server ${SERVER_VERSION} 已发布（tag ${tag} 存在），跳过。"
          else
            echo "server_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::server ${SERVER_VERSION} 尚未发布，将创建 tag ${tag}。"
          fi

      - name: Decide whether to publish
        id: gate
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          SERVER_EXISTS: ${{ steps.tags.outputs.server_exists }}
        run: |
          set -euo pipefail
          if [ "$SERVER_EXISTS" = "false" ]; then
            echo "server_tag=$(node scripts/release-naming.mjs tag server "$SERVER_VERSION")" >> "$GITHUB_OUTPUT"
            echo "::notice::server ${SERVER_VERSION} 尚未发布，将创建 tag"
          else
            echo "server_tag=" >> "$GITHUB_OUTPUT"
            echo "::notice::server ${SERVER_VERSION} 已发布，跳过"
          fi

      - name: Tag server release if version changed
        if: steps.tags.outputs.server_exists == 'false'
        env:
          VERSION: ${{ steps.versions.outputs.server }}
        run: |
          set -euo pipefail
          tag="$(node scripts/release-naming.mjs tag server "$VERSION")"
          sha="$(git rev-parse HEAD)"
          git tag -a "$tag" -m "Release ${tag} (declared in .github/versions/server.yaml)" "$sha"
          git push origin "refs/tags/${tag}"
          echo "::notice::created tag ${tag} at ${sha}"

      - name: Summary
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          SERVER_EXISTS: ${{ steps.tags.outputs.server_exists }}
        run: |
          set -euo pipefail
          if [ "$SERVER_EXISTS" = "true" ]; then
            status="skipped（版本未更新，已发布过）"
          else
            status="released（已打 tag 触发发布）"
          fi
          server_tag="$(node scripts/release-naming.mjs tag server "$SERVER_VERSION")"
          {
            echo "## Version Bump"
            echo ""
            echo "| 组件 | 声明版本 | tag | 结果 |"
            echo "| --- | --- | --- | --- |"
            echo "| 服务端 (server) | ${SERVER_VERSION} | \`${server_tag}\` | ${status} |"
            echo ""
            if [ "${SERVER_EXISTS}" = "true" ]; then
              echo "server 版本号未变化，本次未触发发布。"
              echo "如需发版，请修改 \`.github/versions/server.yaml\` 的 version 后合入 release。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 发布编排 ────────────────────────────────────────────────────────────
  # 直接调用 release.yml / docker.yml，而不是等 tag push 派生 workflow ——
  # GITHUB_TOKEN 推送的 tag 不会触发 downstream workflow
  # （docker.yml 的 on: push: tags 对 bot tag 永远不触发，镜像发布必须在这里显式调用）。
  release-server:
    name: Publish server release
    needs: [bump-tags]
    if: needs.bump-tags.outputs.server_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump-tags.outputs.server_tag }}

  docker:
    name: Publish image
    needs: [bump-tags]
    if: needs.bump-tags.outputs.server_tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_tag: ${{ needs.bump-tags.outputs.server_tag }}
