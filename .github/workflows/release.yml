# GOSpeak Server Release CI —— 单组件、显式版本声明驱动、一版一个 Release。
#
# 版本号来源：.github/versions/server.yaml（服务端）显式声明。合入 release 后由
# version-bump.yml 自动打 tag；也可手动 push tag 或 workflow_dispatch 补跑。
#
# 命名规范（单一事实来源：scripts/release-naming.mjs）：
#   gospeak-server-v1.0.0 → gospeak-server-v1.0.0-linux-amd64
#   校验和：SHA256SUMS-gospeak-server-v1.0.0.txt
#
# 发布链：版本校验（以 server.yaml 为准）→ 渲染 Release 正文 →
# 交叉编译 10 平台二进制 → SHA256SUMS。Docker 镜像由 docker.yml 并行发布。
#
# TODO: use client release —— 前端 dist 不再由本 run 的 workflow artifact 提供，
# 改为从客户端仓 Release 下载；具体直链下载留到 Task 9 实现。
#
# workflow_dispatch 支持手动补跑（tag 留空则取最新 server Release tag），产物幂等覆盖（--clobber）。

name: Release

on:
  push:
    tags: ["gospeak-server-v*"]
  # version-bump.yml 打完 tag 后直接调用本 workflow。
  # 不能只靠上面的 push.tags：version-bump 用 GITHUB_TOKEN 推 tag，
  # GitHub 会抑制由此派生的 workflow（防递归），tag 推上去了但发布不会跑。
  # workflow_call 是 job 级调用，不受该限制，也不需要额外 PAT。
  workflow_call:
    inputs:
      tag:
        description: "要发布的 gospeak-server-v<version> tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest server release tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve Tag ─────────────────────────────────────────────────────────
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            tag="${GITHUB_REF_NAME:-}"
          fi
          if [ -z "$tag" ]; then
            # 手动触发必须显式传 tag；不在多个组件混排的 refs/tags 里猜。
            echo "::error::workflow_dispatch requires the tag input; refusing to guess among gospeak-server-v* tags"
            exit 1
          fi
          parsed="$(node scripts/release-naming.mjs parse "$tag" || true)"
          if [ -z "$parsed" ]; then
            echo "::error::Tag '${tag}' does not follow gospeak-<component>-v<semver>"
            exit 1
          fi
          component="${parsed%% *}"
          if [ "$component" != "server" ]; then
            echo "::error::Tag '${tag}' is not a server release tag"
            exit 1
          fi
          version="${parsed##* }"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag: $tag (version=$version)"

  version-check:
    name: Check Release Version
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - name: Validate release tag against declared version
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: node scripts/check-version.mjs . "$RELEASE_TAG" server

  # ── Create Release ───────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check]
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.body.outputs.release_tag }}
    env:
      RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Render release body
        id: body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ needs.resolve-tag.outputs.tag }}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          cat > /tmp/read-notes.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          const src = readFileSync(process.argv[2], "utf8");
          const block = src.match(/^notes:[ \t]*\|\n((?:[ \t]*[^\n]*\n?)+)/m);
          if (block) {
            console.log(block[1].replace(/^[ \t]+/gm, "").replace(/^\n+|\n+$/g, ""));
            process.exit(0);
          }
          const flow = src.match(/^notes:[ \t]*(?:"([^"]*)"|'([^']*)'|([^#\n]*))/m);
          console.log((flow ? (flow[1] ?? flow[2] ?? flow[3]) : "").trim());
          EOF

          node /tmp/read-notes.mjs .github/versions/server.yaml > /tmp/server-notes.md
          if [ ! -s /tmp/server-notes.md ]; then
            prefix="$(node scripts/release-naming.mjs prefix server)"
            current_tag="$(node scripts/release-naming.mjs tag server "$RELEASE_VERSION")"
            base="$(git for-each-ref --sort=-creatordate \
              --format='%(refname:short)' refs/tags \
              | grep -F "$prefix" | grep -Fvx "$current_tag" | head -n1 || true)"
            if [ -n "$base" ]; then
              node scripts/build-changelog.mjs "$RELEASE_VERSION" "$base" --no-write > /tmp/server-notes.md
            else
              echo "* 首个 server 版本。" > /tmp/server-notes.md
            fi
          fi

          node scripts/release-notes.mjs release \
            --component server \
            --version "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$release_tag" \
            --notes-file /tmp/server-notes.md \
            > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          echo "::notice::release_tag=$release_tag component=server"
          head -20 /tmp/release-notes.md

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.body.outputs.release_tag }}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release view "$release_tag" --json body -q .body > /tmp/release-body-live.md
            if cmp -s /tmp/release-body-live.md /tmp/release-notes.md; then
              echo "Release $release_tag already up to date."
              exit 0
            fi
            echo "Release $release_tag exists; refreshing body."
            gh release edit "$release_tag" --notes-file /tmp/release-notes.md
            exit 0
          fi

          target_sha="$(git rev-parse "${release_tag}^{commit}")"
          args=(
            "$release_tag"
            --target "$target_sha"
            --title "GOSpeak Server v$RELEASE_VERSION"
            --notes-file /tmp/release-notes.md
            --latest
          )
          if ! gh release create "${args[@]}" 2>/tmp/create-err.txt; then
            if grep -qi 'already exists' /tmp/create-err.txt; then
              echo "::notice::Release $release_tag was created by a concurrent run; refreshing body."
              gh release edit "$release_tag" --notes-file /tmp/release-notes.md
              exit 0
            fi
            cat /tmp/create-err.txt >&2
            exit 1
          fi

  # ── 主体：Cross-Platform Server Binaries ────────────────────────────────
  build-release-binaries:
    name: Build server ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      # TODO: use client release —— 前端 dist 不再来自本 run 的 workflow artifact，
      # 改为从客户端仓 Release 下载；具体直链下载留到 Task 9 实现。
      - name: "Frontend dist (TODO: use client release)"
        run: |
          echo "::notice::TODO: use client release — frontend dist download is deferred to Task 9"
          echo "当前 server 仓发布链暂不嵌入 Web 前端。"

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: server/go.sum
          cache-prefix: release-server

      # TODO: use client release：拿到前端 dist 后再嵌入 server/internal/webui/dist。
      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact name
        id: name
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "artifact=$(node scripts/release-naming.mjs artifact-target server "$VERSION" \
            '${{ matrix.target }}' '${{ matrix.ext }}')" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          go build \
            -ldflags="-s -w \
              -X 'GOSpeak/internal/buildinfo.Version=${RELEASE_VERSION}' \
              -X 'GOSpeak/internal/buildinfo.Commit=${RELEASE_COMMIT}'" \
            -o "$ARTIFACT" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-server-${{ matrix.target }}
          path: server/${{ steps.name.outputs.artifact }}
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          echo "Uploading to release $TAG..."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "server/${ARTIFACT}" --clobber

  # ── 主体：SHA256SUMS ────────────────────────────────────────────────────
  checksums:
    name: Generate & Upload SHA256SUMS
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-release-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        # 服务端偶发重压缩致 digest 不匹配（产物无损），warn 避免发布链被炸
        with:
          digest-mismatch: warn
          pattern: gospeak-server-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          name="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" checksum server "$VERSION")"
          sha256sum gospeak-server-* > "$name"
          echo "=== $name ==="
          cat "$name"
          echo "checksum_file=$name" >> "$GITHUB_OUTPUT"
        id: sums

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          SUMS: ${{ steps.sums.outputs.checksum_file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping SHA256SUMS upload."
            exit 0
          fi
          gh release upload "$TAG" "dist/${SUMS}" --clobber
