# GOSpeak Server CI — 质量门禁（按路径精准触发）
# 三仓拆分后只保留服务端相关检查：JS / 桌面 / 移动端代码已拆到 Client 仓。
# 保留 workflow_call 兼容外部调用；仓库内正式发布由 release.yml 独立负责。
name: CI

on:
  pull_request:
    branches: [release, dev]
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      js: ${{ steps.filter.outputs.js }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'server/**'
            js:
              - 'test/**'
            ci:
              - '.github/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'Dockerfile'

  lint:
    name: Lint (go vet)
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
          needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy config guard (env 与 livekit.yaml 一致性)
        # 防止把 LiveKit 密钥硬编码回 livekit.yaml，或让 .env 与注入表达式脱节。
        # 校验逻辑单一来源在 deploy/init.sh --check，本地可直接复跑。
        run: ./deploy/init.sh --check
      # 模块缓存与编译缓存统一由 go-build-cache 接管（setup-go 自带缓存无法
      # 区分完整/残缺缓存，被取消的 job 会留下半成品毒害后续所有 run）。
      - uses: actions/setup-go@v7
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        # 与上面的 setup-go 同条件：仅 test/ 变化时不装 Go，这里也不能执行 go mod download。
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
        with:
          go-sum-path: server/go.sum
          cache-prefix: server-lint
      - name: Vet
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
        working-directory: server
        run: go vet ./...

  proto-check:
    name: Proto gen-diff
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: server/go.sum
          cache-prefix: server-proto
      - name: Install protoc
        # 固定版本：apt 自带的 protobuf-compiler（3.21.12）会把生成物的
        # "protoc vX" 注释写成另一个值，让 gen-diff 恒红；生成物由 36.2 产出。
        env:
          PROTOC_VERSION: "36.2"
        run: |
          set -euo pipefail
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -sSfL "$url" -o /tmp/protoc.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          /tmp/protoc/bin/protoc --version
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Verify generated plugin proto is up to date
        working-directory: server
        run: |
          protoc -I plugin/proto --go_out=internal/plugin/gen --go_opt=paths=source_relative --go-grpc_out=internal/plugin/gen --go-grpc_opt=paths=source_relative plugin.proto
          git diff --exit-code -- internal/plugin/gen

  test-server:
    name: Test Server (Go)
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true') &&
          (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' || inputs.run_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: server/go.sum
          cache-prefix: server-test
      - name: Test
        working-directory: server
        env:
          CGO_ENABLED: 0
        run: go test ./... -count=1

  # race 检测单独成 job：CGO_ENABLED=1 会让全部依赖以竞态检测模式重编译，
  # 与普测串在同一个 job 会把关键路径拉长到 ~260s。拆开后两 job 并行，
  # 门禁总时长由慢的那个决定，省去串行等待。
  test-server-race:
    name: Test Server (Go, race)
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true') &&
          (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' || inputs.run_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: server/go.sum
          cache-prefix: server-test-race
      - name: Test (race)
        # 并发敏感包必须过 -race：测试侧 mock 的非原子计数曾长期掩盖竞争。
        working-directory: server
        env:
          CGO_ENABLED: 1
        run: go test -race ./internal/signal/... ./internal/ws/... ./internal/bus/... -count=1

  test-scripts:
    name: Test CI Scripts (node --test)
    # scripts/ 下的辅助脚本此前没有任何 CI 覆盖，导致 check-version 与
    # build-changelog 的单测长期处于失效状态却无人发现。
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.ci == 'true' || needs.changes.outputs.js == 'true' ||
           needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install
      - name: Script unit tests
        run: node --test scripts/*.test.mjs
      - name: Release naming self-check (server)
        run: |
          set -euo pipefail
          test "$(node scripts/release-naming.mjs tag server 1.0.0)" = "gospeak-server-v1.0.0"
          test "$(node scripts/release-naming.mjs artifact server 1.0.0 linux amd64)" = "gospeak-server-v1.0.0-linux-amd64"
          test "$(node scripts/release-naming.mjs checksum server 1.0.0)" = "SHA256SUMS-gospeak-server-v1.0.0.txt"
      - name: Version consistency (server)
        run: node scripts/check-version.mjs . "" server

  protocol-check:
    name: Protocol gen-diff
    needs: changes
    # 无条件对所有 PR/push 运行：gate 硬性要求本 job 为 success，
    # 若按路径跳过会变成 skipped 并把前端/文档 PR 全部卡死。
    # 独立于 run_tests：手动关闭 Go 测试也不能关掉协议漂移检查。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: server/go.sum
          cache-prefix: server-protocol
      - name: Verify generated protocol is up to date
        working-directory: server
        run: |
          go run ./cmd/gen-protocol -update-golden
          git diff --exit-code -- internal/genprotocol/testdata/golden

  workflow-lint:
    name: Workflow Lint (actionlint)
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        # 固定版本，避免上游发版无声改变门禁结果。
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" | tar xz -C /tmp actionlint
          /tmp/actionlint -version
      - name: Lint workflows
        run: /tmp/actionlint -color

  proxyrules-sync:
    name: Proxyrules sync
    # 服务端插件代理用的是 proxyrules 的等价副本（源实现在 GOSpeak-Client 仓）。
    # 无条件运行：gate 要求本 job 为 success，按路径跳过会变成 skipped 把 PR 卡死。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify server proxyrules copy matches client source
        run: node scripts/check-proxyrules-sync.mjs

  gate:
    name: CI Gate
    if: always()
    # 只聚合 Server 仓自身的 job；JS / 桌面 / 移动端检查已拆到 Client 仓。
    needs: [lint, test-server, test-server-race, test-scripts, protocol-check, proto-check, proxyrules-sync, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PROTOCOL_CHECK_RESULT: ${{ needs.protocol-check.result }}
          PROTO_CHECK_RESULT: ${{ needs.proto-check.result }}
          PROXYRULES_SYNC_RESULT: ${{ needs.proxyrules-sync.result }}
          TEST_SERVER_RESULT: ${{ needs.test-server.result }}
          TEST_SERVER_RACE_RESULT: ${{ needs.test-server-race.result }}
          TEST_SCRIPTS_RESULT: ${{ needs.test-scripts.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          set -euo pipefail
          # 协议漂移检查是必过项：不接受 skipped。
          if [ "$PROTOCOL_CHECK_RESULT" != "success" ]; then
            echo "required protocol gen-diff check did not pass: $PROTOCOL_CHECK_RESULT" >&2
            exit 1
          fi
          if [ "$PROTO_CHECK_RESULT" != "success" ]; then
            echo "required proto gen-diff check did not pass: $PROTO_CHECK_RESULT" >&2
            exit 1
          fi
          # proxyrules 副本漂移同样是必过项：它不是代码风格问题，是安全规则分叉。
          if [ "$PROXYRULES_SYNC_RESULT" != "success" ]; then
            echo "required proxyrules sync check did not pass: $PROXYRULES_SYNC_RESULT" >&2
            exit 1
          fi
          for result in "$LINT_RESULT" "$TEST_SERVER_RESULT" "$TEST_SERVER_RACE_RESULT" "$TEST_SCRIPTS_RESULT" "$WORKFLOW_LINT_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required CI job failed: $result" >&2; exit 1 ;;
            esac
          done
