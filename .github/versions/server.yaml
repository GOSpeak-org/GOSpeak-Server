# GOSpeak 服务端（server + web）发布版本 —— 显式声明，CI 的单一事实来源。
#
# 发版流程：修改本文件的 version 并合入 release 后，version-bump.yml 会自动打上
# `gospeak-server-v<version>` tag，release.yml / docker.yml 随之构建发布。
#
# 该 tag 创建服务端自己的 GitHub Release，只含服务端产物（二进制 + SHA256SUMS）。
# 桌面端/移动端有各自的 tag 与 Release，互不混装。
#
# 命名规范（scripts/release-naming.mjs）：
#   tag      gospeak-server-v<version>
#   二进制   gospeak-server-v<version>-<os>-<arch>[.exe]
#   校验和   SHA256SUMS-gospeak-server-v<version>.txt
#
# 同步约束（release.yml 的 version-check 会校验）：根 VERSION 与根 package.json
# 的 version 必须与本文件一致。
version: "1.4.0-rc.1"

# 本次发版说明：优先作为 GitHub Release 的 release notes（块标量 | 多行）。
# 留空时由 scripts/build-changelog.mjs 按 conventional commits 生成，
# 基线只取本组件的历史 tag。
notes: |
  GOSpeak 1.4.0-rc.1 —— 三仓拆分后的服务端首个独立发布。

  ## 发布形态
  - 服务端独立为 `GOSpeak-Server` 仓，产物发布到本仓 Release（根仓只做聚合页）
  - 单版本产出 10 个平台二进制（linux amd64/arm64/armv7、darwin amd64/arm64、
    freebsd amd64/arm64、openbsd amd64、windows amd64/arm64）与 `SHA256SUMS`
  - 构建参数：`CGO_ENABLED=0` + `GOOS/GOARCH(/GOARM)`，ldflags 注入
    `GOSpeak/internal/buildinfo.Version/Commit`

  ## 工程
  - 发版链：`version-bump` 读取本文件声明的版本 → 打 tag → `release.yml` 交叉编译并上传产物
  - lefthook 增加 pre-push 门禁，禁止直接推 `release` 分支
